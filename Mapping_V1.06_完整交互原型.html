function renderGraph(){const person=get('person',view.personId);if(!db.mappings.some(m=>m.type==='person'&&m.objId===person.id)){return header('候选人详情 / 社交关系图谱','当前候选人尚未关联人才Mapping。',`<select id="personPick" class="select" style="width:144px">${db.people.map(p=>`<option value="${p.id}" ${p.id===person.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`)+`<div class="panel">${empty('尚未创建人才 Mapping','系统以当前候选人主档为中心创建唯一社交关系图谱；不存在关系时不自动推断。',btn('创建并打开社交图谱','createCurrentMapping','primary','data-type="person"'))}</div>`}const g=graphData(),active=activeGraphRelations();let nodePos=Object.fromEntries(g.nodes.map(n=>[n.key,{x:n.x+73,y:n.y+48}]));const hideOthers=view.graphHover&&view.graphSettings.highlight;const graphLines=active.map(r=>{let a=nodePos[r.a],b=nodePos[r.b];if(!a||!b)return '';let dim=hideOthers&&r.a!==view.graphHover&&r.b!==view.graphHover;let focus=(!dim&&hideOthers)||view.graphFocus===r.id;return `<g><path class="edge-hit" d="M ${a.x} ${a.y} L ${b.x} ${b.y}" data-action="inspectRel" data-id="${r.id}"/><path class="edge-line ${dim?'dim':''} ${focus?'focus':''}" d="M ${a.x} ${a.y} L ${b.x} ${b.y}"/><text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2-8}" text-anchor="middle">${esc(r.type)}</text></g>`}).join('');let nhtml=g.nodes.map(n=>{let [type,id]=n.key.split(':'),obj=graphNode(n.key),dim=hideOthers&&n.key!==view.graphHover&&!active.some(r=>(r.a===view.graphHover&&r.b===n.key)||(r.b===view.graphHover&&r.a===n.key));return `<div class="graph-node ${n.key===view.graphHover?'focus':''} ${dim?'dim':''}" style="left:${n.x}px;top:${n.y}px" data-nodekey="${esc(n.key)}" tabindex="0" title="右键操作节点；Alt+拖动为原型演示"><div class="avatar">${type==='person'?'人':'企'}</div><div class="gnname">${esc(view.graphSettings.nameShow?obj?.name:'（姓名显示关闭）')}</div><div class="gnmeta">${type==='person'?esc(obj?.role||'候选人'):'客户（公司）'} ${n.key==='person:'+view.personId?'· 中心':''}</div></div>`}).join('');return header('候选人详情 / 社交关系图谱','真实关系由人工维护，视图中的节点/连线移除与“结束真实关系”严格分开。',`<select id="personPick" class="select" style="width:144px">${db.people.map(p=>`<option value="${p.id}" ${p.id===person.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>${btn('＋ 添加节点','addGraphNode','primary')}${btn('＋ 添加关系','addRelation')}${btn('图谱设置','graphSettings')}`)+`<div class="split"><div class="panel"><div class="panel-head"><div><div class="panel-title">${esc(person.name)} · 人才 Mapping</div><div class="hint">右键人员或公司节点显示操作菜单，点击关系线查看历史。节点可 Alt＋鼠标拖动（演示交互）。</div></div>${btn('重新加载关系','reloadGraph','sm')}</div><div class="panel-body" style="padding:11px"><div class="canvas-card"><div class="canvas-scroll"><div class="graph-stage"><div class="canvas-grid"></div><svg class="canvas-connections" width="1020" height="550" viewBox="0 0 1020 550" style="pointer-events:auto">${graphLines}</svg>${nhtml}</div></div></div></div><div class="controlstrip"><span class="hint" style="margin-right:auto">${g.nodes.length} 节点 · ${active.length} 可见有效关系</span>${btn('管理关系历史','viewRelations','sm')}${btn('添加公司/人员','addGraphNode','sm')}</div></div><div class="inspector"><div class="panel-title">关系与显示设置</div><div class="divider"></div><div class="kvs"><dt>中心候选人</dt><dd>${esc(person.name)}</dd><dt>可见节点</dt><dd>${g.nodes.length} 个</dd><dt>有效连线</dt><dd>${active.length} 条</dd><dt>噪音上限</dt><dd>${view.graphSettings.noise} <span class="tiny muted">默认值暂定为5</span></dd><dt>姓名显示</dt><dd>${view.graphSettings.nameShow?'开':'关'}（仅视图）</dd><dt>一度高亮</dt><dd>${view.graphSettings.highlight?'开':'关'}</dd><dt>同事关系</dt><dd>人工维护，不从组织架构自动生成</dd></div><div class="alert">右键节点 → 查看详情、添加关系、展开/收起、移除。<br>选中连线后可 <b>仅移除画布连线</b> 或 <b>结束真实关系</b>。后者必须保留历史。</div><div class="divider"></div>${btn('查看全部关系（含历史）','viewRelations','sm')}<div class="p-banner" style="margin-top:12px">[待原型验收] Alt 拖动和姓名显示的精确手势、噪音上限的实际截断范围与默认设置。</div></div></div>`}
function workForCustomer(companyName){let result=[],incomplete=[];for(let w of db.work){let hits=w.items.filter(t=>t.company===companyName);if(!hits.length)continue;let ordered=w.items.slice().sort((a,b)=>(a.start||'').localeCompare(b.start||''));let current=hits.find(h=>h.end===null&&h.verifiedCurrent);let dubious=hits.find(h=>h.end===null&&!h.verifiedCurrent);let incompleteSeg=hits.find(h=>h.end==='');let chosen=current||(!dubious&&!incompleteSeg?hits.filter(x=>typeof x.end==='string'&&x.end).sort((a,b)=>b.end.localeCompare(a.end))[0]:null);if(!chosen){incomplete.push({w,reason:dubious?'简历写“至今”但未核实':'目标公司离职日期缺失'});continue;}let idx=ordered.indexOf(chosen);let prev=idx>0?ordered[idx-1]:null;let next=idx>=0&&idx<ordered.length-1?ordered[idx+1]:null;const isCurrent=chosen.end===null;result.push({id:w.personId,person:get('person',w.personId),prev:prev?.company||'上一家公司未记录',func:chosen.func,next:isCurrent?'在职':next?.company||'下一家公司未记录',end:chosen.end,live:isCurrent,source:w.source,updated:w.updated,items:w.items});}return {result,incomplete}}
function daysAgoCut(years){let d=new Date();d.setFullYear(d.getFullYear()-years);return d.toISOString().slice(0,7)}
function candidatesForSankey(){let company=get('company',view.companyId);let {result,incomplete}=workForCustomer(company.name);let funcs=[...new Set(result.map(r=>r.func))];let filtered=result.filter(r=>(!view.sankeyFunctions.length||view.sankeyFunctions.includes(r.func))&&(view.sankeyPeriod==='all'||(view.sankeyPeriod==='current'?r.live:!r.live&&r.end>=daysAgoCut(Number(view.sankeyPeriod)))));return {filtered,result,incomplete,funcs}}
function countForPeriod(p){let r=workForCustomer(get('company',view.companyId).name).result;return r.filter(x=>(!view.sankeyFunctions.length||view.sankeyFunctions.includes(x.func))&&(p==='all'||(p==='current'?x.live:!x.live&&x.end>=daysAgoCut(Number(p))))).length}
function sankeySVG(rows){if(!rows.length)return empty('当前筛选下暂无可绘制的人才流向','切换行业/职能或时间范围；日期不完整和待核实的记录不会被猜测计入。');let dims={prev:[],func:[],next:[]};['prev','func','next'].forEach(k=>dims[k]=[...new Set(rows.map(r=>r[k]))].map(label=>({label,ids:rows.filter(r=>r[k]===label).map(r=>r.id)})));let maxLen=Math.max(...Object.values(dims).map(x=>x.length));let H=Math.max(330,maxLen*74+80),xs={prev:26,func:360,next:700};let widths={prev:193,func:195,next:193};let positions={};let parts=[];for(let type of ['prev','func','next']){let list=dims[type],cellH=(H-75)/Math.max(list.length,1);positions[type]={};list.forEach((n,i)=>positions[type][n.label]={x:xs[type],y:42+i*cellH,h:Math.min(40,cellH-13)});}const linkList=[];for(let [a,b] of [['prev','func'],['func','next']]){let map={};for(let r of rows){let k=r[a]+'|~|'+r[b];(map[k]||(map[k]={a:r[a],b:r[b],n:0})).n++}Object.values(map).forEach((l,idx)=>{let n1=positions[a][l.a],n2=positions[b][l.b];let sy=n1.y+n1.h/2,ty=n2.y+n2.h/2,width=Math.max(5,l.n*4);linkList.push(`<path class="linkband" d="M ${n1.x+widths[a]} ${sy} C ${(n1.x+widths[a]+n2.x)/2} ${sy}, ${(n1.x+widths[a]+n2.x)/2} ${ty}, ${n2.x} ${ty}" stroke="${a==='prev'?'#719bc7':'#70b7a5'}" stroke-width="${width}" fill="none"/>`)});}for(let type of ['prev','func','next']){for(let n of dims[type]){let p=positions[type][n.label],isCurr=n.label==='在职';parts.push(`<g class="sk-node" data-action="openSankeyNode" data-type="${type}" data-label="${esc(n.label)}"><rect x="${p.x}" y="${p.y}" width="${widths[type]}" height="${p.h}" rx="6" fill="${type==='prev'?'#dfeaf5':type==='func'?'#d1e0f4':isCurr?'#d8f0e6':'#e6eaf3'}" stroke="#b9cbe0"/><text x="${p.x+9}" y="${p.y+17}">${esc(n.label.length>13?n.label.slice(0,12)+'…':n.label)}</text><text class="sk-num" x="${p.x+widths[type]-12}" y="${p.y+30}" text-anchor="end">${n.ids.length} 人</text></g>`)}}return `<svg class="sankey-svg" viewBox="0 0 915 ${H}" role="img" aria-label="从上一家公司经过目标公司职能流向下一家公司的人才桑基图"><text x="25" y="20" font-weight="bold">上一家公司</text><text x="360" y="20" font-weight="bold">目标公司 / 职能</text><text x="700" y="20" font-weight="bold">在职状态 / 下一家公司</text>${linkList.join('')}${parts.join('')}</svg>`}
function renderSankey(){const co=get('company',view.companyId),{filtered,result,incomplete,funcs}=candidatesForSankey(),opts=[['all','不限'],['current','在职'],['3','最近3年'],['6','最近6年'],['9','最近9年'],['12','最近12年']];return header('客户详情 / 候选人流向','基于当前客户对应的目标公司工作经历：上一家公司 → 目标公司职能 → 在职或下一家公司。',`<select id="sankeyCustomer" class="select" style="width:193px">${db.companies.map(c=>`<option value="${c.id}" ${c.id===co.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>${btn('打开组织架构','nav','sm','data-route="org"')}`)+`<div class="stat-row"><div class="stat"><span class="label">当前筛选去重人才</span><div class="val">${filtered.length}</div></div><div class="stat"><span class="label">目标公司经历可用</span><div class="val">${result.length}</div></div><div class="stat"><span class="label">资料不完整/待核实</span><div class="val">${incomplete.length}</div></div><div class="stat"><span class="label">统计口径</span><div style="font-size:13px;font-weight:700;margin-top:9px">候选人ID去重</div></div></div><div class="panel"><div class="crumbtabs"><button class="crumbtab" data-action="nav" data-route="org">组织架构</button><button class="crumbtab active">候选人流向</button></div><div class="panel-body"><div class="grid2" style="grid-template-columns:1.4fr 1fr;align-items:start"><div>${field('职能/岗位（可多选）',`<div class="filter-options"><label class="checkpill ${!view.sankeyFunctions.length?'active':''}"><input type="checkbox" data-action="sankeyFunction" data-func="__all" ${!view.sankeyFunctions.length?'checked':''}/>不限</label>${funcs.map(f=>`<label class="checkpill ${view.sankeyFunctions.includes(f)?'active':''}"><input type="checkbox" data-action="sankeyFunction" data-func="${esc(f)}" ${view.sankeyFunctions.includes(f)?'checked':''}/> ${esc(f)}</label>`).join('')}</div>`)}</div><div>${field('筛选范围（按目标公司离职日期）',`<select class="select" id="sankeyPeriod">${opts.map(([v,label])=>`<option value="${v}" ${view.sankeyPeriod===v?'selected':''}>${label}（${countForPeriod(v)}人）</option>`).join('')}</select>`)}</div></div><div class="alert" style="margin:16px 0 13px">在职仅指仍在<b>${esc(co.name)}</b>且有可信核实信息；最近N年按离开目标公司的日期计算。来源过期、日期缺失或顺序冲突的资料不推断。</div><div style="overflow:auto">${sankeySVG(filtered)}</div></div><div class="controlstrip"><span class="hint" style="margin-right:auto">点击三个栏目中的矩形节点，查看匹配简历列表。色带仅用于展示，不是下钻入口。</span>${btn('清空筛选','resetSankey','sm')}${btn('查看待核实数据','showIncomplete','sm')}</div></div>`}
function renderCandidate(){const p=get('person',view.personId),w=db.work.find(w=>w.personId===p.id);return header('候选人详情','从流向分析下钻后，查看人员档案及对应简历工作经历来源。',`${btn('社交关系图谱','nav','primary','data-route="graph"')}${btn('返回候选人流向','nav','sm','data-route="sankey"')}`)+`<div class="grid2"><div class="panel"><div class="panel-head"><strong>候选人主档</strong>${tag('示例数据')}</div><div class="panel-body"><div class="rowitem"><div class="person-dot">${esc(p.name[0])}</div><div class="rowinfo"><strong>${esc(p.name)}</strong><small>${esc(p.role)}</small></div></div><dl class="kvs"><dt>编号</dt><dd>${esc(p.id)}</dd><dt>城市</dt><dd>${esc(p.city)}</dd><dt>联系信息</dt><dd>${esc(p.phone.slice(0,3)+'****'+p.phone.slice(-4))} · ${esc(p.email)}</dd></dl>${btn('打开该候选人社交图谱','nav','sm','data-route="graph"')}</div></div><div class="panel"><div class="panel-head"><strong>简历工作经历（来源追溯）</strong></div><div class="panel-body">${w?`<div class="hint" style="margin-bottom:14px">来源：${esc(w.source)} · 更新于 ${esc(w.updated)}</div>${w.items.map(x=>`<div class="rowitem"><div class="company-dot">企</div><div class="rowinfo"><strong>${esc(x.company)}</strong><small>${esc(x.func)} · ${esc(x.start)} — ${x.end===null?(x.verifiedCurrent?'在职（已核实）':'至今（待核实）'):esc(x.end||'日期缺失')}</small></div></div>`).join('')}`:empty('暂无简历工作经历','无数据不能自动推断上一家公司或下一家公司。')}</div></div></div>`}

function modalWrap(title,body,foot='',wide=false){return `<div class="modal-back" data-action="backdrop"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-header"><h3>${title}</h3><button class="iconbtn" data-action="closeModal" aria-label="关闭">×</button></div><div class="modal-content">${body}</div><div class="modal-footer">${foot||btn('关闭','closeModal')}</div></div></div>`}

else if(m.kind==='addCompany'){title='项目人才地图 · 添加目标公司';let q=m.query||'',matches=db.companies.filter(c=>c.name.includes(q)||c.industry.includes(q));body=`<div class="alert">来源：既有客户（公司）主档。地图只引用主档ID，不能通过本入口批量导入或新建空节点。</div><div style="margin-top:14px">${field('搜索客户名称',`<input class="input" id="modalCompanySearch" placeholder="输入客户名称后检索" value="${esc(q)}" autocomplete="off"/>`)}</div><div id="modalCompanyResults" style="margin-top:12px">${companySearchResults(matches,q)}</div>`;foot=btn('关闭','closeModal');}

function linkCandidateToMap(id){const m=mapData();if(m.people.includes(id)){signal('该候选人已在当前地图，不会重复建立节点');return false}if(!get('project',view.projectId).candidateIds.includes(id)){signal('只允许添加当前项目已关联的候选人',true);return false}m.people.push(id);m.hidden=m.hidden.filter(k=>k!=='person:'+id);persist();signal('候选人加入当前人才地图');return true}
function orgPosition(id){return (db.org[view.companyId]||[]).find(n=>n.id===id)}
function linkEmployee(id,posId){let nodes=db.org[view.companyId]||[],target=nodes.find(n=>n.id===posId);if(!target||target.kind!=='position'){signal('目标岗位不存在',true);return false}let duplicate=nodes.find(n=>n.id!==posId&&(n.employees||[]).includes(id));if(duplicate){signal('该候选人已关联本客户岗位「'+duplicate.name+'」，同公司只能关联一个岗位',true);return false}if(target.employees.includes(id)){signal('该员工已在此岗位');return false}target.employees.push(id);persist();signal('岗位人员关联已保存');return true}
function executeConfirm(command,p){if(command==='removeMapNode'){let map=mapData(),[kind,id]=p.key.split(':');if(kind==='company')map.companies=map.companies.filter(x=>x!==id);else map.people=map.people.filter(x=>x!==id);persist();signal('仅移除当前地图的展示关联，主档未删除')}
 else if(command==='removeEmployee'){let node=orgPosition(p.position);if(node)node.employees=node.employees.filter(x=>x!==p.person);persist();signal('已从当前岗位解除关联，候选人主档保留')}
 else if(command==='endRel'){let r=db.relations.find(r=>r.id===p.id);if(r&&r.active){r.active=false;r.history.push({action:'结束真实关系（历史保留）',time:new Date().toLocaleString('zh-CN')});persist();signal('真实关系已结束，历史保留')}view.drawer={kind:'relationDetail',id:p.id}}
 else if(command==='removeGraphNode'){let g=graphData();g.nodes=g.nodes.filter(n=>n.key!==p.key);persist();signal('仅从当前画布移除节点和可见连线；真实关系与主档未变')}
 else if(command==='changeOrgParent'){let n=orgPosition(p.id);if(n){n.parent=p.parent;n.name=p.name;persist();signal('组织节点与上级已修改，请核对下级影响')}}}
function handleAction(action,el,e){const id=el.dataset.id,key=el.dataset.key;switch(action){
 case 'nav':nav(el.dataset.route);break;
 case 'newMapping':setModal('newMapping',{type:'project'});break;
 case 'createCurrentMapping':{let type=el.dataset.type,id=type==='person'?view.personId:view.companyId;let {exists}=ensureMapping(type,id);render();signal(exists?'已打开现有 Mapping':'Mapping 已创建，并关联当前主档');break}
 case 'openMapping':goToMappingFile(db.mappings.find(m=>m.id===id));break;
 case 'clearMapping':view.mappingQuery='';view.mappingType='all';render();break;
 case 'submitMapping':{let type=document.getElementById('mType')?.value,id=document.getElementById('mObj')?.value;if(!id)return signal('请先选择关联对象',true);const {m,exists}=ensureMapping(type,id);goToMappingFile(m);signal(exists?'已有同类型同对象 Mapping，已打开原文件':'Mapping 创建成功；名称来自主档且不可编辑');break}
 case 'addCompany':setModal('addCompany',{query:''});break;
 case 'chooseProjectCompany':linkCompanyToMap(id);closeModal();render();break;
 case 'startNewCustomer':setModal('newCustomer',{name:view.modal?.query||'',industry:'智能制造'});break;
 case 'saveCustomer':{const m=view.modal,name=(document.getElementById('customerName')?.value||'').trim(),industry=document.getElementById('customerIndustry')?.value||'其他';m.name=name;m.industry=industry;if(!name){m.error='客户名称不能为空';renderModal();return}let dupe=db.companies.find(c=>c.name.trim().toLowerCase()===name.toLowerCase());if(dupe){m.error='已有同名客户主档（'+dupe.id+'）。请关闭弹框并在添加目标公司中选择现有主档；不会自动合并。';renderModal();return}if(view.failCompany){m.error='原型模拟：客户主档保存失败。已保留表单，请关闭失败开关后重试。';renderModal();return}let newCo={id:nextId('co'),name,industry};db.companies.push(newCo);db.org[newCo.id]=[];persist();if(view.failLink){view.linkedPending={id:newCo.id,projectId:view.projectId};setModal('partialLink',{id:newCo.id});signal('客户已创建；地图关联失败',true);return}linkCompanyToMap(newCo.id);closeModal();render();break}
 case 'retryProjectLink':{let pending=view.linkedPending;if(!pending||pending.id!==id){signal('没有可重试的关联记录',true);return}let prev=view.projectId;view.projectId=pending.projectId;linkCompanyToMap(id);view.projectId=prev;view.linkedPending=null;closeModal();render();signal('已通过现有客户ID重试关联，没有重复创建客户');break}
 case 'addProjectPerson':setModal('addProjectPerson',{query:''});break;
 case 'chooseProjectPerson':linkCandidateToMap(id);closeModal();render();break;
 case 'openCustomerFromMap':view.companyId=id;closeModal();view.drawer=null;nav('org');break;
 case 'openCandidate':view.personId=id;closeModal();view.drawer=null;nav('candidate');break;
 case 'removeProjectNode':confirmAction('移除地图关联','只从当前项目人才地图移除该对象和显示连线，客户/候选人主档及其他项目关联不变。确认移除？','removeMapNode',{key},true);break;
 case 'zoomProject':view.projectZoom=Math.min(1.5,Math.max(.6,view.projectZoom+Number(el.dataset.delta)));render();break;
 case 'fitProject':view.projectZoom=1;render();break;
 case 'fullscreenProject':{let x=document.querySelector('.canvas-card');if(x?.requestFullscreen)x.requestFullscreen().catch(()=>signal('当前浏览器不支持该演示全屏',true));break}
 case 'addOrg':setModal('addOrg',{nodeKind:el.dataset.kind||'department',parentId:el.dataset.parent||''});break;
 case 'editOrg':setModal('editOrg',{id});break;
 case 'saveOrg':{let m=view.modal,nm=(document.getElementById('orgName')?.value||'').trim();if(!nm){m.error='名称必填';renderModal();return}let nodes=db.org[view.companyId]||(db.org[view.companyId]=[]);if(m.kind==='addOrg'){nodes.push({id:nextId('on'),parent:m.parentId||null,kind:m.nodeKind,name:nm,employees:[]});persist();signal('组织节点已保存')}else{let n=orgPosition(m.id),parent=document.getElementById('orgParent')?.value||null;if(!n)return signal('组织节点已不存在',true);if(parent!==n.parent){let isDesc=(candidate,goal)=>{let curr=nodes.find(z=>z.id===candidate);while(curr?.parent){if(curr.parent===goal)return true;curr=nodes.find(z=>z.id===curr.parent)}return false};if(parent===n.id||(parent&&isDesc(parent,n.id))){m.error='不能将节点放到自身或下级节点下';renderModal();return}persist();closeModal();confirmAction('调整组织上级','修改上级将影响该节点下的所有下级组织关系。是否继续？','changeOrgParent',{id:n.id,parent,name:nm},true);render();return}n.name=nm;persist();signal('组织名称已更新')}closeModal();render();break}
 case 'addEmployee':setModal('addEmployee',{positionId:el.dataset.position,query:''});break;
 case 'linkEmployee':{let posId=view.modal.positionId,ok=linkEmployee(id,posId);if(ok){closeModal();render()}break}
 case 'startNewEmployee':setModal('newEmployee',{positionId:view.modal.positionId,name:view.modal.query||''});break;
 case 'saveEmployee':{let m=view.modal,name=(document.getElementById('employeeName')?.value||'').trim(),phone=(document.getElementById('employeePhone')?.value||'').trim(),email=(document.getElementById('employeeEmail')?.value||'').trim();m.name=name;m.phone=phone;m.email=email;if(!name){m.error='姓名必填';renderModal();return}let exact=db.people.find(p=>(phone&&p.phone===phone)||(email&&p.email.toLowerCase()===email.toLowerCase()));if(exact){m.error='检测到相同电话或邮箱，建议在上一层搜索并关联既有候选人：'+exact.name+'。为避免复制主档，本次不创建。';renderModal();return}let similar=db.people.find(p=>p.name===name);if(similar&&!m.reviewed){m.error='检测到同名候选人「'+similar.name+'」；请核实后再次点击保存（不自动合并）。';m.reviewed=true;renderModal();return}let p={id:nextId('u'),name,phone:phone||'未填写',email:email||'未填写',city:'',role:orgPosition(m.positionId)?.name||'员工'};db.people.push(p);if(!linkEmployee(p.id,m.positionId)){db.people=db.people.filter(z=>z.id!==p.id);persist();return}persist();closeModal();render();signal('员工主档已新建，并直接关联当前岗位');break}
 case 'removeEmployee':confirmAction('移除岗位员工','仅取消该员工在当前公司的岗位关联，不删除候选人主档或其简历历史。确认移除？','removeEmployee',{person:el.dataset.person,position:el.dataset.position},true);break;
 case 'renameCustomer':setModal('renameCustomer');break;
 case 'saveCustomerRename':{let name=(document.getElementById('renameCustomerText')?.value||'').trim(),co=get('company',view.companyId);if(!name)return signal('名称不能为空',true);if(db.companies.some(c=>c.id!==co.id&&c.name===name))return signal('已有同名客户，请先核实主档',true);const old=co.name;co.name=name;db.projects.forEach(p=>{if(p.client===old)p.client=name});db.work.forEach(w=>w.items.forEach(i=>{if(i.company===old)i.company=name}));persist();closeModal();render();signal('客户主档名称已变更；Mapping显示名称同步，唯一对象ID不变');break}
 case 'orgLayout':view.orgLayout=el.dataset.layout;render();break;
 case 'zoomOrg':view.orgZoom=Math.max(.6,Math.min(1.4,view.orgZoom+Number(el.dataset.delta)));render();break;
 case 'fitOrg':view.orgZoom=1;render();break;
 case 'addGraphNode':setModal('addGraphNode',{nodeType:'person',query:''});break;
 case 'joinPersonFromGraph':{let old=view.projectId;view.projectId=el.dataset.project;let ok=linkCandidateToMap(id);view.projectId=old;closeModal();render();if(ok)signal('已加入该项目人才地图，候选人项目归属未变');break}
 case 'chooseGraphNode':{let g=graphData();if(g.nodes.some(n=>n.key===key)){signal('该节点已在当前图谱');return}let count=g.nodes.length;g.nodes.push({key,x:100+(count%4)*216,y:56+Math.floor(count/4)*135});persist();closeModal();render();signal('仅新增图谱节点，未自动创建真实关系');break}
 case 'addRelation':{let g=graphData();if(g.nodes.length<2){signal('请先在图谱中添加第二个节点',true);return}setModal('relation',{sourceKey:'person:'+view.personId});break}
 case 'saveRelation':{let m=view.modal,a=document.getElementById('relSource').value,b=document.getElementById('relTarget').value,type=document.getElementById('relType').value,source=document.getElementById('relSourceText').value.trim(),collected=document.getElementById('relCollected').value,verified=document.getElementById('relVerified').checked,verifiedAt=document.getElementById('relVerifiedAt').value,note=document.getElementById('relNote').value.trim();if(a===b){m.error='不能给同一个节点建立自关联';renderModal();return}if(verified&&(!source||!verifiedAt)){m.error='标记已核实时，必须填写可追溯来源及核实日期';renderModal();return}if(m.id){let r=db.relations.find(r=>r.id===m.id);if(!r)return;let before={a:r.a,b:r.b,type:r.type,source:r.source,collected:r.collected,verified:r.verified,verifiedAt:r.verifiedAt,note:r.note};r.a=a;r.b=b;r.type=type;r.source=source;r.collected=collected;r.verified=verified;r.verifiedAt=verifiedAt;r.note=note;r.history.push({action:'修改真实关系',time:new Date().toLocaleString('zh-CN'),before,after:{a,b,type,source,collected,verified,verifiedAt,note}});}else{db.relations.push({id:nextId('r'),a,b,type,source,collected,verified,verifiedAt,note,active:true,history:[]})}persist();closeModal();view.drawer=null;render();signal('真实关系已保存；操作历史保留');break}
 case 'editRelation':view.drawer=null;setModal('relation',{id});break;
 case 'inspectRel':view.graphFocus=id;view.drawer={kind:'relationDetail',id};render();break;
 case 'viewRelations':view.drawer={kind:'relations'};renderDrawer();break;
 case 'hideGraphEdge':{let g=graphData();if(!g.hiddenEdges.includes(id))g.hiddenEdges.push(id);persist();view.drawer=null;render();signal('只移除当前图谱连线，真实关系仍有效');break}
 case 'endRel':confirmAction('结束真实关系','此操作将真实关系标记为已结束（历史记录保留），不同于仅从图谱隐藏连线。确认结束？','endRel',{id},true);break;
 case 'reloadGraph':graphData().hiddenEdges=[];graphData().collapsed=[];persist();render();signal('已恢复当前有效真实关系的展示，不会重新生成关系');break;
 case 'graphSettings':setModal('graphSettings');break;
 case 'saveGraphSettings':{let s=view.graphSettings;s.noise=Math.max(1,Math.min(50,Number(document.getElementById('graphNoise').value)||5));s.altDrag=document.getElementById('graphAltDrag').checked;s.nameShow=document.getElementById('graphNameShow').checked;s.highlight=document.getElementById('graphHighlight').checked;closeModal();render();signal('视图设置已应用；真实关系未修改');break}
 case 'openSankeyNode':view.sankeyNode={field:el.dataset.type,label:el.dataset.label};view.drawer={kind:'sankeyCandidates',field:el.dataset.type,label:el.dataset.label};renderDrawer();break;
 case 'resetSankey':view.sankeyFunctions=[];view.sankeyPeriod='all';view.drawer=null;render();break;
 case 'showIncomplete':view.drawer={kind:'incomplete'};renderDrawer();break;
 case 'openDemo':setModal('demo');break;
 case 'demoState':view.demo=el.dataset.value;closeModal();render();signal('已切换到「'+view.demo+'」原型页面状态');break;
 case 'resetDemo':view.demo='normal';render();break;
 case 'resetSeed':if(confirm('重置所有本地演示改动并恢复初始数据？')){db=clone(seed);persist();view.demo='normal';view.modal=null;view.drawer=null;view.projectId='pr1';view.companyId='co1';view.personId='u1';render();signal('已恢复示例数据')}break;
 case 'closeModal':closeModal();break;
 case 'closeDrawer':view.drawer=null;renderDrawer();break;
 case 'backdrop':if(e.target.classList.contains('modal-back'))closeModal();break;
 case 'drawerBackdrop':if(e.target.classList.contains('drawer-back')){view.drawer=null;renderDrawer()}break;
 case 'acceptConfirm':{let m=view.modal;view.modal=null;executeConfirm(m.command,m.payload||{});render();break}
 case 'ctxDetails':{let k=view.context.key;view.context=null;view.drawer={kind:'nodeDetails',key:k};render();break}
 case 'ctxAddRel':{let k=view.context.key;view.context=null;renderContext();setModal('relation',{sourceKey:k});break}
 case 'ctxJoinProjectMap':{let k=view.context.key;view.context=null;renderContext();setModal('graphAddToMap',{personId:k.split(':')[1]});break}
 case 'ctxCollapse':{let g=graphData(),k=view.context.key;g.collapsed=g.collapsed.includes(k)?g.collapsed.filter(x=>x!==k):[...g.collapsed,k];persist();view.context=null;render();break}
 case 'ctxReload':view.context=null;graphData().hiddenEdges=[];graphData().collapsed=[];render();break;
 case 'ctxRemove':{let k=view.context.key;view.context=null;renderContext();confirmAction('从图谱移除节点','此操作只移除当前画布中的节点和关联线，不删除主档或结束真实关系。确认？','removeGraphNode',{key:k},true);break}
 default:signal('当前操作仅作为原型提示：'+action);break;
}}
// Input handlers preserve basic text-entry continuity.
function updateOnInput(el){let id=el.id;if(id==='mappingSearch'){let start=el.selectionStart;view.mappingQuery=el.value;renderShell();let n=document.getElementById('mappingSearch');n?.focus();try{n?.setSelectionRange(start,start)}catch(e){};return}
if(id==='projectQuery'){let start=el.selectionStart;view.projectQuery=el.value;renderShell();let n=document.getElementById('projectQuery');n?.focus();try{n?.setSelectionRange(start,start)}catch(e){};return}
let modalIds={modalCompanySearch:'addCompany',modalPersonSearch:'addProjectPerson',employeeSearch:'addEmployee',graphNodeSearch:'addGraphNode'};if(modalIds[id]&&view.modal){let cursor=el.selectionStart;view.modal.query=el.value;renderModal();let n=document.getElementById(id);n?.focus();try{n?.setSelectionRange(cursor,cursor)}catch(e){}}}
function updateOnChange(el){switch(el.id){case 'mappingType':view.mappingType=el.value;render();break;case 'projectPick':view.projectId=el.value;view.projectQuery='';view.industry='all';render();break;case 'projectIndustry':view.industry=el.value;render();break;case 'maskToggle':view.mask=el.checked;render();break;case 'socialToggle':view.showSocial=el.checked;render();break;case 'companyPick':view.companyId=el.value;render();break;case 'personPick':view.personId=el.value;view.graphFocus='';render();break;case 'sankeyCustomer':view.companyId=el.value;view.sankeyFunctions=[];view.sankeyPeriod='all';view.drawer=null;render();break;case 'sankeyPeriod':view.sankeyPeriod=el.value;view.drawer=null;render();break;case 'mType':{view.modal.type=el.value;view.modal.objId=null;renderModal();break}case 'mObj':view.modal.objId=el.value;renderModal();break;case 'graphNodeType':view.modal.nodeType=el.value;view.modal.query='';renderModal();break;case 'failCustomerToggle':view.failCompany=el.checked;if(el.checked)view.failLink=false;renderModal();break;case 'failLinkToggle':view.failLink=el.checked;if(el.checked)view.failCompany=false;renderModal();break;default:if(el.dataset.action==='sankeyFunction'){let f=el.dataset.func;if(f==='__all')view.sankeyFunctions=[];else if(el.checked)view.sankeyFunctions.push(f);else view.sankeyFunctions=view.sankeyFunctions.filter(x=>x!==f);view.drawer=null;render()}break}}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el){if(view.context&&!e.target.closest('.contextmenu')){view.context=null;renderContext()}return}let action=el.dataset.action;if(action==='sankeyFunction')return;if((action==='backdrop'||action==='drawerBackdrop')&&e.target!==el)return;e.preventDefault();if(!action)return;handleAction(action,el,e)});
document.addEventListener('input',e=>updateOnInput(e.target));
document.addEventListener('change',e=>updateOnChange(e.target));
document.addEventListener('contextmenu',e=>{const el=e.target.closest('.graph-node');if(!el)return;e.preventDefault();view.context={key:el.dataset.nodekey,x:e.clientX,y:e.clientY};renderContext()});
document.addEventListener('mouseover',e=>{const el=e.target.closest('.graph-node');if(!el||view.route!=='graph')return;let key=el.dataset.nodekey;if(view.graphHover!==key){view.graphHover=key;renderShell()}});
document.addEventListener('mouseout',e=>{const el=e.target.closest('.graph-node');if(!el||view.route!=='graph')return;if(!el.contains(e.relatedTarget)){view.graphHover='';renderShell()}});
let drag=null;
document.addEventListener('pointerdown',e=>{let el=e.target.closest('.graph-node');if(!el||view.route!=='graph'||!e.altKey||!view.graphSettings.altDrag)return;let g=graphData(),n=g.nodes.find(x=>x.key===el.dataset.nodekey);if(!n)return;drag={key:n.key,el,x0:e.clientX,y0:e.clientY,x:n.x,y:n.y};e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!drag)return;let x=Math.max(3,Math.min(870,drag.x+e.clientX-drag.x0)),y=Math.max(3,Math.min(435,drag.y+e.clientY-drag.y0));drag.el.style.left=x+'px';drag.el.style.top=y+'px'});
document.addEventListener('pointerup',e=>{if(!drag)return;let n=graphData().nodes.find(x=>x.key===drag.key);if(n){n.x=Math.max(3,Math.min(870,drag.x+e.clientX-drag.x0));n.y=Math.max(3,Math.min(435,drag.y+e.clientY-drag.y0));persist()}drag=null;render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(view.modal)closeModal();else if(view.drawer){view.drawer=null;renderDrawer()}else if(view.context){view.context=null;renderContext()}}});
window.addEventListener('hashchange',()=>{let hash=location.hash.slice(1);if(['mapping','project','org','graph','sankey','candidate'].includes(hash))nav(hash)});
let initial=location.hash.slice(1);if(['mapping','project','org','graph','sankey','candidate'].includes(initial))view.route=initial;
render();
</script>
